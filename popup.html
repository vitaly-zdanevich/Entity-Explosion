<!DOCTYPE html>
<html lang='en'>
<head>
	<meta charset='UTF-8'>
	<meta name='viewport' content='width=device-width, initial-scale=1'>
	<meta name='color-scheme' content='light dark'>
	<title>Entity Explosion</title>
	<link rel='stylesheet' href='popup.css'>
	<script type='module' src='item-properties.js'></script>
</head>
<body>
	<div class='popup'>
		<!-- Controls are available before JavaScript or remote data finishes loading. -->
		<header>
			<label for='box0' id='boxLabel0' lang='en'>Languages</label>
			<select id='box0' name='language'><option value='en'>English</option></select>
			<label for='box1' id='boxLabel1'>Entity</label>
			<select id='box1' name='entity' disabled><option value=''>(select)</option></select>
			<div class='status-row'>
				<span id='searchSpinner' class='spinner' aria-hidden='true' hidden></span>
				<span id='status' role='status' aria-live='polite'></span>
				<button id='refresh' type='button'>Refresh</button>
			</div>
		</header>
		<main id='results' aria-busy='false'>
			<section id='div_title' hidden></section>
			<section id='div_wdlink' hidden></section>
			<section id='div_wiki' hidden></section>
			<section id='div1' hidden></section>
			<section id='div2' hidden></section>
			<section id='div3' hidden></section>
		</main>
	</div>
</body>
</html>
